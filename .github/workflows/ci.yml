name: client CI pipeline

on:
    push:
        branches: 
            - develop
            - feat/103-ci-pipeline-client
    pull_request:
        branches: 
            - develop

jobs: 
    lint-and-format:
        name: Lint & Format Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 9

            - name: Setup node
              uses: actions/setup-node@v4
              with: 
                node-version: 20
                cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            
            - name: Typecheck
              run: pnpm exec tsc --noEmit
            
            - name: Run eslint
              run: pnpm run lint

    test: 
        name: Unit Tests & Coverage
        runs-on: ubuntu-latest
        
        steps: 
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 9

            - name: Setup node
              uses: actions/setup-node@v4
              with: 
                node-version: 20
                cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run tests with coverage
              run: pnpm test:coverage
            
            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                name: coverage-report
                path: coverage/
                retention-days: 7
    
    build: 
        name: Build
        runs-on: ubuntu-latest
        needs: [
            lint-and-format,
            test
        ]
        
        steps: 
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 9

            - name: Setup node
              uses: actions/setup-node@v4
              with: 
                node-version: 20
                cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build app
              run: pnpm build 

